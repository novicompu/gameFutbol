# Stack SOLO del backend (api + mysql + redis), util para trabajar este repo
# de forma aislada. Expone la API en http://localhost:3000
#
# Para levantar el juego completo (front + api con un solo dominio) usar el
# docker-compose.yml de la carpeta padre.

services:
  api:
    build:
      context: .
    image: gamefutbol-api:latest
    restart: unless-stopped
    ports:
      - "3000:3001"
    environment:
      PORT: 3001
      MARCA: diagamer
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: Zafiro30
      DB_NAME: dataGame
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      SECRET_PASSPHRASE: SCM123LA0VE34A4JUBEA34
      CORS_ORIGIN: '*'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Zafiro30
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: dataGame
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    shm_size: 512m
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-pZafiro30", "-e", "SELECT 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
  redis-data:
